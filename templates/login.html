{% extends 'base.html' %}

{% block title %}Klaim.id - Login Admin{% endblock %}
{% block page_title %}Login Administrator{% endblock %}
{% block page_subtitle %}Silakan masukkan username dan password Anda{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 450px; margin: 2rem auto;">
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required>
        </div>
        
        <div style="margin-top: 2.5rem;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="ri-login-box-line"></i> Masuk ke Dashboard
            </button>
        </div>
    </form>
</div>
{% endblock %}
